name: Pure FFmpeg TV Stream

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          sudo pip3 install yt-dlp

      - name: Run Direct Overlay Stream
        env:
          FB_LIVE_URL: ${{ secrets.FB_LIVE_URL }}
        run: |
          node stream.js
