name: 24/7 Web Page Streamer

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install FFmpeg & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Dependencies
        run: npm install

      - name: Start Live Streaming
        env:
          FB_STREAM_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          chmod +x stream.sh
          timeout 5h ./stream.sh || true
