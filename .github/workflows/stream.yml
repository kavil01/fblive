name: 24/7 Web Page Streamer

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb fluxbox chromium-browser xdotool

      - name: Run Stream Script
        env:
          FB_STREAM_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          chmod +x stream.sh
          timeout 5h ./stream.sh || true
