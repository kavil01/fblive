name: 24/7 Facebook Stream

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer

      - name: Run Puppeteer Stream Script
        env:
          FB_LIVE_URL: ${{ secrets.FB_LIVE_URL }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99.0
          sleep 3
          node stream.js
